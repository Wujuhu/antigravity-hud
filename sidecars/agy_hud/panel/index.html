<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>AGY HUD</title>
  <link rel="stylesheet" href="/styles.css" />
</head>
<body>
  <div class="shell">
    <header class="topbar">
      <div class="brand">
        <span class="brand-dot" id="statusDot"></span>
        <h1>AGY HUD</h1>
        <span class="meta" id="statusSub">:9229</span>
      </div>
      <button class="btn" id="btnRefresh">刷新</button>
    </header>

    <!-- 1. 周额度估算（仅打开本面板时按需计算） -->
    <section class="card">
      <div class="card-head">
        <h2>周额度估算</h2>
        <span class="meta" id="weeklySessionsBadge">7d</span>
      </div>
      <div id="weeklyEstimateBody" class="stack"></div>
    </section>

    <!-- 2. CDP 与启动器 -->
    <section class="card">
      <div class="card-head">
        <h2>CDP</h2>
        <div class="inline-group">
          <input id="inputPort" type="number" min="1024" max="65535" value="9229" aria-label="CDP Port" />
          <button class="btn" id="btnSavePort">应用</button>
          <label class="switch">
            <input type="checkbox" id="chkCdpEnabled" checked />
            <span class="slider"></span>
          </label>
        </div>
      </div>
      <div class="launcher-row">
        <button class="btn btn-solid" id="btnGenerateLauncher">生成启动器</button>
        <code class="path-chip" id="launcherResult" hidden></code>
      </div>
    </section>

    <!-- 3. 更新 -->
    <section class="card">
      <div class="card-head">
        <h2>更新</h2>
        <span class="meta" id="versionBadge">v1.0.0</span>
      </div>
      <div class="inline-row">
        <input id="inputRepoSlug" type="text" placeholder="owner/agy-hud" aria-label="GitHub Repo" />
        <button class="btn" id="btnSaveRepo">保存</button>
        <button class="btn" id="btnCheckUpdate">检查</button>
        <button class="btn btn-solid" id="btnApplyUpdate" disabled>更新</button>
      </div>
      <div class="update-foot">
        <div class="check-pair">
          <label class="chk-inline"><input type="checkbox" id="chkAutoCheckUpdate" checked /><span>自动检查</span></label>
          <label class="chk-inline"><input type="checkbox" id="chkAutoApplyUpdate" /><span>自动更新</span></label>
        </div>
        <span class="meta" id="updateStatusText"></span>
      </div>
    </section>

    <!-- 4. 自定义 HUD 数据与顺序（放在最后） -->
    <section class="card">
      <div class="card-head">
        <h2>HUD 数据与顺序</h2>
        <button class="btn btn-ghost" id="btnReset">重置</button>
      </div>

      <div class="select-row">
        <select id="selectCtxFormat" aria-label="上下文格式">
          <option value="percent">上下文: 24%</option>
          <option value="tokens">上下文: 124k</option>
          <option value="both">上下文: 24% 124k</option>
        </select>
        <select id="selectWindowCap" aria-label="窗口上限">
          <option value="auto">上限: 自动</option>
          <option value="256000">上限: 256k</option>
          <option value="512000">上限: 512k</option>
          <option value="1048576">上限: 1M</option>
        </select>
      </div>

      <div class="sub-head">输入栏</div>
      <ul class="sortable-list" id="pillItemsList"></ul>

      <div class="sub-head" style="margin-top:10px">悬浮窗</div>
      <ul class="sortable-list" id="popoverSectionsList"></ul>
    </section>
  </div>

  <script src="/app.js"></script>
</body>
</html>
