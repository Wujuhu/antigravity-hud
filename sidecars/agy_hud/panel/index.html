<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>AGY HUD</title>
  <link rel="stylesheet" href="/styles.css" />
</head>
<body>
  <div class="shell">
    <!-- 1. 额度估算（仅打开本面板时按需计算） -->
    <section class="panel-group">
      <div class="group-head">
        <h2>额度估算</h2>
        <span class="meta" id="weeklyUpdatedAt">--</span>
      </div>
      <div id="weeklyEstimateBody" class="weekly-body"></div>
    </section>

    <!-- 2. 界面（默认收起） -->
    <details class="panel-group fold" id="layoutConfigDetails">
      <summary class="fold-head">
        <h2>界面</h2>
        <div class="fold-right">
          <span class="meta fold-summary-text" id="layoutSummaryText">原版</span>
          <svg class="fold-chevron" viewBox="0 0 16 16" width="13" height="13" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M6 3.5L10.5 8L6 12.5" />
          </svg>
        </div>
      </summary>

      <div class="fold-body">
        <div class="seg-group" id="compactModeGroup" role="radiogroup" aria-label="排版模式">
          <button class="seg-btn" type="button" data-compact-mode="relaxed">舒适</button>
          <button class="seg-btn" type="button" data-compact-mode="off">原版</button>
          <button class="seg-btn" type="button" data-compact-mode="compact">紧凑</button>
        </div>

        <div class="slider-list" id="compactSliders">
          <div class="slider-row">
            <div class="slider-head">
              <span>行间距</span>
              <span class="meta" id="valLineHeight">1.55</span>
            </div>
            <input type="range" id="rangeLineHeight" min="1.2" max="3.0" step="0.05" value="1.55" aria-label="行间距" />
          </div>
          <div class="slider-row">
            <div class="slider-head">
              <span>段间距</span>
              <span class="meta" id="valBlockGap">14px</span>
            </div>
            <input type="range" id="rangeBlockGap" min="2" max="50" step="1" value="14" aria-label="段间距" />
          </div>
          <div class="slider-row">
            <div class="slider-head">
              <span>列表间距</span>
              <span class="meta" id="valListGap">6px</span>
            </div>
            <input type="range" id="rangeListGap" min="0" max="30" step="1" value="6" aria-label="列表间距" />
          </div>
        </div>

        <div class="setting-list">
          <div class="setting-row">
            <div class="setting-info">
              <div class="setting-title">每轮底部总信息栏</div>
              <div class="setting-desc">在每轮对话末尾显示模型、思考强度、缓存、耗时、TPS、总 Token 与金额</div>
            </div>
            <label class="switch switch-sm">
              <input type="checkbox" id="chkShowTurnSummary" checked />
              <span class="slider"></span>
            </label>
          </div>
        </div>
      </div>
    </details>

    <!-- 3. HUD（默认收起，点击展开） -->
    <details class="panel-group fold" id="hudConfigDetails">
      <summary class="fold-head">
        <h2>HUD</h2>
        <div class="fold-right">
          <span class="meta fold-summary-text" id="hudSummaryText">Context · TPS · 5h 额度</span>
          <svg class="fold-chevron" viewBox="0 0 16 16" width="13" height="13" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M6 3.5L10.5 8L6 12.5" />
          </svg>
        </div>
      </summary>

      <div class="fold-body">
        <ul class="clean-list" id="pillItemsList"></ul>

        <div class="setting-list">
          <div class="setting-row">
            <div class="setting-info">
              <div class="setting-title">上下文显示模式</div>
              <div class="setting-desc">控制输入栏胶囊中上下文的显示形式</div>
            </div>
            <select id="selectCtxFormat" aria-label="上下文显示模式">
              <option value="percent">占比</option>
              <option value="tokens">Token</option>
              <option value="both">占比 + Token</option>
            </select>
          </div>
          <div class="setting-row">
            <div class="setting-info">
              <div class="setting-title">上下文上限</div>
              <div class="setting-desc">默认读取 Antigravity 会话实际窗口上限，可手动覆盖</div>
            </div>
            <select id="selectWindowCap" aria-label="上下文上限">
              <option value="auto">自动</option>
              <option value="256000">256k</option>
              <option value="512000">512k</option>
              <option value="1048576">1M</option>
            </select>
          </div>
        </div>

        <div class="fold-foot">
          <button class="btn-text" id="btnReset" type="button">恢复默认</button>
        </div>
      </div>
    </details>

    <!-- 4. 更新（默认绑定官方云端仓库） -->
    <section class="panel-group">
      <div class="group-head">
        <div class="title-inline">
          <h2>更新</h2>
          <span class="ver-tag" id="versionBadge">v1.0.1</span>
          <span class="meta" id="updateStatusText"></span>
        </div>
        <div class="action-inline">
          <button class="btn-subtle" id="btnCheckUpdate" type="button">检查更新</button>
          <button class="btn-accent" id="btnApplyUpdate" type="button" hidden>立即更新</button>
        </div>
      </div>
      <div class="toggle-strip">
        <label class="toggle-item">
          <span>定时自动检查</span>
          <span class="switch switch-sm">
            <input type="checkbox" id="chkAutoCheckUpdate" checked />
            <span class="slider"></span>
          </span>
        </label>
        <label class="toggle-item">
          <span>发现新版自动更新</span>
          <span class="switch switch-sm">
            <input type="checkbox" id="chkAutoApplyUpdate" />
            <span class="slider"></span>
          </span>
        </label>
      </div>
    </section>

    <!-- 5. CDP 状态（正常时仅单行状态；异常时才展示提醒与生成启动器） -->
    <section class="panel-group">
      <div class="group-head">
        <div class="title-inline">
          <span class="status-dot" id="statusDot"></span>
          <h2>CDP 状态</h2>
          <span class="meta cdp-subnote">该状态决定 HUD 的正常显示</span>
        </div>
        <span class="status-badge" id="cdpStateText">检测中</span>
      </div>
      <div id="cdpRepairArea" hidden>
        <p class="cdp-alert" id="cdpAlertText"></p>
        <div class="cdp-foot">
          <button class="btn-row" id="btnGenerateLauncher" type="button">
            <span class="btn-row-left">
              <svg viewBox="0 0 16 16" width="13" height="13" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <path d="M6.5 3.5H3.5a1 1 0 0 0-1 1v8a1 1 0 0 0 1 1h8a1 1 0 0 0 1-1v-3" />
                <path d="M9 2.5h4.5V7" />
                <path d="M13.5 2.5L7.5 8.5" />
              </svg>
              <span id="btnGenerateLauncherLabel">生成启动器</span>
            </span>
            <svg class="btn-row-arrow" viewBox="0 0 16 16" width="12" height="12" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <path d="M6 3.5L10.5 8L6 12.5" />
            </svg>
          </button>
          <div class="cdp-success" id="launcherResultBox" hidden>
            <div class="cdp-success-msg" id="launcherResultMsg"></div>
            <div class="path-note" id="launcherResult"></div>
          </div>
        </div>
      </div>
    </section>
  </div>

  <script src="/app.js"></script>
</body>
</html>
